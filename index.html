<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ойгон — цифровой иммунитет молодёжи</title>
<meta name="description" content="Квест, тренажёр и разборы, которые учат узнавать манипуляцию и вербовку в сети. Без регистрации.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=10">
</head>
<body>
<div class="banner" id="banner" role="region" aria-label="Объявление" hidden>
  <svg class="bn-ic" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 9h16v4H4zM12 9v12M4 13v7h16v-7M12 9c-2.5 0-4-1-4-2.5S9.2 4 12 6c2.8-2 4-.5 4 .5S14.500 9 12 9z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <div class="bn-text"><b>Классный час для школ</b> <span class="bn-date">Пилот · 30–40 минут</span>
    <strong>УВАЖАЕМЫЕ УЧИТЕЛЯ!</strong>
    <span>Приглашаем вас провести урок «Цифровой иммунитет»: игра, тренажёр и разбор без регистрации и сбора данных.</span></div>
  <button class="bn-btn" data-act="info" data-k="teachers">Подробнее <span aria-hidden="true">→</span></button>
  <button class="bn-x" id="bn-x" aria-label="Закрыть объявление">×</button>
</div>
<header class="top">
  <a class="logo" href="#/home" aria-label="Ойгон — на главную">
    <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true">
      <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffa07a"/><stop offset=".55" stop-color="#e070d8"/><stop offset="1" stop-color="#6f8dff"/></linearGradient></defs>
      <circle cx="16" cy="16" r="13" fill="none" stroke="url(#lg)" stroke-width="3"/>
      <circle cx="16" cy="16" r="5" fill="#16161a" class="logo-dot"/>
    </svg>
    <span>Ойгон</span>
  </a>
  <nav class="topnav" aria-label="О платформе">
    <button data-act="info" data-k="about" data-i18n="about">О проекте</button>
    <button data-act="info" data-k="rules" data-i18n="rules">Правила</button>
    <button data-act="info" data-k="partners" data-i18n="partners">Партнёры</button>
    <button data-act="info" data-k="help" data-i18n="help">Помощь</button>
  </nav>
  <div class="lang" role="group" aria-label="Язык">
    <button data-lang="ru" aria-pressed="true">РУ</button>
    <button data-lang="ky" aria-pressed="false">КЫ</button>
  </div>
  <button class="menu" data-act="menu" aria-label="Меню">
    <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
  </button>
</header>

<main id="view" tabindex="-1" aria-live="polite"></main>

<nav class="dock" id="dock" aria-label="Разделы"></nav>

<dialog id="modal"><div class="modal-in"><button class="x" data-act="close" aria-label="Закрыть">×</button><div id="modal-body"></div></div></dialog>

<script src="data.js?v=10"></script>
<script src="banner.js?v=10"></script>
<script src="game.js?v=10"></script>
<script src="app.js?v=10"></script>
</body>
</html>
