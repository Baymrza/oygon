 {title:"Обрезанный скриншот",place:"Мира",point:[1,0],goal:"Подойди к Мире у входа. Она видела публикацию, которую переслал Тимур.",scenario:"Айдана отправила жалобу. Тем временем Тимур уже переслал в классный чат обрезанный скриншот из закрытой группы. Мира заметила, что из скриншота вырезаны дата и начало разговора. Подпись обвиняет целую группу людей.",question:"Как вы с Мирой проверите утверждение?",options:[

 ,{title:"Громкий заголовок",place:"Нур",point:[2,1],goal:"Нур у входа. Разберите карточку, которую переслали в школьное медиа.",mode:"inspect",scenario:"Школьному медиа прислали картинку с обвинением и призывом «перешли всем». На карточке есть фрагмент цитаты. Какие два пункта реально помогут проверить её?",options:[

 result:"Полная запись и сведения об источнике помогают обнаружить искажение. Число реакций не подтверждает содержание."},
 {title:"Редакционный выбор",place:"Лейла",point:[3,2],goal:"Поговори с Лейлой у скамейки. Она готовит пост для школьного канала.",scenario:"Оригинал подтвердил, что цитату вырвали из контекста. Школьный канал хочет объяснить ситуацию, пока ложное обвинение расходится по чатам.",question:"Как исправить ошибку?",options:[
 ["Опубликовать краткое исправление со ссылкой на оригинал","Читатели увидят проверяемый источник, а исправление не повторит ложное обвинение в заголовке.",true],

 {title:"Навязчивый куратор",place:"Бек",point:[2,3],goal:"Бек ждёт у выхода. Помоги ему составить план после разговора в игровом чате.",mode:"order",scenario:"В игровом чате незнакомый «куратор» оправдывает насилие и требует продолжить беседу в личке. Прямой угрозы сейчас нет. Разложи предложенные шаги по порядку: прекратить разговор, передать жалобу через меню сообщения, затем заблокировать контакт.",options:[

 ["Отправить жалобу через меню сообщения","",2]],
 result:"Так Бек прекращает разговор, передаёт сообщение на проверку и ограничивает дальнейший контакт."},
 {title:"Поддержка после чата",place:"Дина эже",point:[0,1],goal:"Подойди к Дине эже. Бек хочет рассказать о случившемся взрослому.",scenario:"Даже после блокировки Бек беспокоится, что его будут осуждать за то, что он вообще ответил незнакомцу. Он просит помочь начать разговор с Диной эже.",question:"Как начать этот разговор?",options:[
 ["Рассказать о переписке при всех без согласия Бека","Публичность может помешать Беку попросить о помощи."],
 ["Предложить поговорить наедине и остаться рядом, если Бек этого хочет","Так Бек может рассказать о давлении в спокойной обстановке и получить поддержку.",true],
 ["Посоветовать больше никому об этом не говорить","Поддержка взрослого помогает справиться с переживаниями и обсудить следующий безопасный шаг."]]}
 ,{title:"Три версии",mode:"investigate",goal:"В чате обвиняют Арсена в распространении призывов к насилию. Поговори с тремя свидетелями и выясни, что они видели.",

  {place:"Данияр",point:[1,0],note:"Я видел полный фрагмент переписки. Арсен отвечал на предложение закрыть спор. Призыв к насилию написал другой аккаунт."},
  {place:"Алина",point:[3,3],note:"Мне сказали, что аккаунтом якобы управляет Арсен. Я не видела, кто им пользуется, а тот, кто мне это сказал, сослался на слух в другом чате."}
 ],
 cards:[
  ["Автор другого аккаунта — Арсен.",false],
  ["На обрезанном скриншоте отсутствовало сообщение, на которое ответил Арсен.",true],
  ["Арсен поддержал призыв к насилию словами «он прав».",false],
  ["В полном фрагменте ответ Арсена относится к предложению закрыть спор.",true],
  ["Призыв к насилию появился под именем другого аккаунта.",true],

];
const treeNodes=[
 [90,102,-1],[280,102,0],[470,102,1],[660,102,2],
 [280,240,0],[470,240,4],[280,379,0],[470,379,6],[280,518,0]
];
const $=id=>document.getElementById(id), canvas=$("world"), ctx=canvas.getContext("2d");
const storageKey="dozor-map-v3";
let completed=new Set();
try{
 const saved=JSON.parse(localStorage.getItem(storageKey));
 const legacy=Math.min(4,Number(localStorage.getItem("dozor-actions-v2"))||0);
 completed=new Set(Array.isArray(saved)?saved.filter(id=>Number.isInteger(id)&&treeNodes[id]):[0,1,2,3].slice(0,legacy));
}catch{}
const unlocked=i=>i===0||completed.has(treeNodes[i][2]);
const story=i=>i<4?"После звонка":i<6?"Школьное медиа":i<8?"Игровой чат":"Расследование во дворе";
const mode=i=>({inspect:"Проверка источника",order:"План действий",investigate:"Сбор показаний"}[missions[i].mode]||"Диалог");
let index=0, player=[0,3], visual=[...player], route=[], facing=[0,-1], moving=false, correct=false, last=0, marker=[0,0];
let witnessCount=0;
const target=()=>missions[index].witnesses?.[witnessCount]??missions[index];
const forest=[[-1.65,1.4,1.2],[4.65,.45,1.18],[-1.65,3.3,.9],[4.45,3.25,.94]];
const colors={wood:["#d7a36a","#b78148","#9b6335"],path:["#e0c48e","#cfb17a","#c6a674"],leaf:["#7fac43","#5c9032","#417d31"],wall:["#f0eadb","#ddd9c3","#bdbba7"]};
const faces=[];
let width=0,height=0,scale=0,centerX=0,centerY=0;
function depth(x,z){return x*.45+z*.89;}
function project([x,y,z]){
 const d=depth(x-1.65,z-1.55), perspective=1/(1-.046*(d+y*.4));
 return [centerX+((x-1.65)*.89-(z-1.55)*.45)*scale*perspective,centerY+(d*.63-y*.81)*scale*perspective];
}
function face(vertices,color){
 const distance=vertices.reduce((n,[x,y,z])=>n+depth(x,z)+y*.76,0)/vertices.length;
 faces.push({vertices,color,distance});
}
function slab(x,z,w,d,y,color){face([[x,y,z],[x+w,y,z],[x+w,y,z+d],[x,y,z+d]],color);}
function box(x,y,z,w,h,d,p){
 const X=x+w,Y=y+h,Z=z+d;
 slab(x,z,w,d,Y,p[0]);
 face([[x,y,Z],[X,y,Z],[X,Y,Z],[x,Y,Z]],p[1]);
 face([[X,y,z],[X,y,Z],[X,Y,Z],[X,Y,z]],p[2]);
}
function round(x,y,z,r,h,ris,sides,p){
 const ring=(r,y)=>Array.from({length:sides},(_,i)=>[x+r*Math.cos(i*2*Math.PI/sides),y,z+r*Math.sin(i*2*Math.PI/sides)]);
 const a=ring(r,y),b=ring(ris,y+h);
 for(let i=0;i<sides;i++){
   const j=(i+1)%sides, angle=(i+.5)*2*Math.PI/sides;
   if(Math.cos(angle)*.45+Math.sin(angle)*.89>-.16)face([a[i],a[j],b[j],b[i]],p[1+i%(p.length-1)]);
 }
 if(ris)face(b,p[0]);
}
function poly(points,color){
 ctx.beginPath();
 points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));
 ctx.closePath();ctx.fillStyle=color;ctx.fill();
}
function flat(x,z,rx,rz,c){
 poly(Array.from({length:22},(_,i)=>{const a=i*Math.PI/11;return project([x+Math.cos(a)*rx,.003,z+Math.sin(a)*rz]);}),c);
}
function tree(x,z,s){
 box(x-.07,0,z-.07,.14,.66*s,.14,colors.wood);
 round(x,.48*s,z,.24*s,.44*s,.48*s,7,colors.leaf);
 round(x,.92*s,z,.48*s,.51*s,.37*s,7,colors.leaf);
 round(x,1.43*s,z,.37*s,.61*s,0,7,colors.leaf);
}
function character(x,z,npc=false){
 const [dx,dz]=npc?[0,1]:facing, twist=dx!==0, stride=moving&&!npc?Math.sin(last/67)*.052:0;
 const legs=["#496879","#344d64","#273744"], boots=["#3a433e","#2d352f","#211f1e"], red=npc?[["#79a65f","#517945","#41613a"],["#b488bc","#885e91","#66416f"],["#5391be","#35648e","#294d72"],["#b78655","#92653e","#69482e"]][index%4]:["#da503c","#ae3225","#862521"], skin=["#ffe0af","#f3c190","#d69a6a"];
 for(const k of [-1,1]){
   const a=k*.082,b=k*stride;
   const px=x+(twist?b:a),pz=z+(twist?a:b);
   box(px-.054,.05,pz-.055,.108,.26,.11,legs);
   box(px-.061,0,pz-.072,.122,.09,.144,boots);
   const ax=x+(twist?0:k*.187),az=z+(twist?k*.187:0);
   box(ax-.05,.306,az-.053,.10,.20,.106,skin);
   box(ax-.055,.437,az-.057,.11,.13,.114,["#fff8d8","#ebe6cf","#c3c4b1"]);
 }
 round(x,.275,z,.14,.043,.151,10,["#e8b04e","#e7a846","#ad732e"]);
 round(x,.318,z,.151,.25,.132,10,red);
 round(x,.545,z,.115,.17,.105,10,skin);
 round(x,.595,z,.117,.052,.119,10,["#3c3530","#2b2d28","#252622"]);
 round(x,.661,z,.133,.107,.098,10,["#ffffef","#e8e7db","#c3c9bb"]);
 box(x+dx*.105-.064,.656,z+dz*.105-.063,.128,.028,.126,["#f7f6dc","#d6d8c4","#aab5a6"]);
}
function render(){
 const dpr=Math.min(2,window.devicePixelRatio||1), w=canvas.clientWidth,h=canvas.clientHeight;
 if(!w||!h)return;
 if(w!==width||h!==height||canvas.width!==Math.round(w*dpr)){
  width=w;height=h;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
 }
 ctx.setTransform(dpr,0,0,dpr,0,0);
 scale=Math.min(width/6.4,height/4.7);centerX=width*.53;centerY=height*.52;
 ctx.fillStyle="#c2dda5";ctx.fillRect(0,0,width,height);
 poly([[-.7,0,-.55],[3.75,0,-.55],[3.75,0,3.6],[-.7,0,3.6]].map(project),"#dbd7cc");
 for(let z=0;z<4;z++)for(let x=0;x<4;x++){
  poly([[x-.49,.004,z-.49],[x+.49,.004,z-.49],[x+.49,.004,z+.49],[x-.49,.004,z+.49]].map(project),(x+z)%2?"#c7c4be":"#cfccc5");
 }
 poly([[.38,0,3.5],[1.58,0,3.5],[1.58,0,5.4],[.38,0,5.4]].map(project),"#c9c7bf");
 forest.forEach(([x,z,s])=>flat(x+.22,z+.23,.43*s,.32*s,"#9bb884"));
 flat(visual[0]+.1,visual[1]+.08,.24,.16,"#9b9b91");
 const [mx,mz]=target().point??[-10,-10];
 if(target().point)flat(mx,mz,.36,.26,"#f5df9b");
 faces.length=0;
 forest.forEach(t=>tree(...t));
 const brick=["#d9c5a7","#c6a78a","#ad8873"];
 const trim=["#faf1dc","#decab0","#bda890"];
 const glass=["#bedde6","#7399ac","#56778e"];
 box(-.8,0,-1.83,4.75,1.58,1.25,brick);
 box(-.9,1.56,-1.9,4.93,.13,1.39,trim);
 box(-.84,0,-.62,4.82,.19,.08,trim);
 for(const x of [-.48,.33,2.35,3.16]){
   box(x,.64,-.6,.59,.59,.09,trim);
   box(x+.055,.70,-.507,.48,.46,.022,glass);
   box(x+.28,.70,-.483,.035,.46,.018,trim);
 }
 box(1.16,0,-.59,.86,.96,.1,trim);
 box(1.23,.075,-.485,.72,.82,.043,glass);
 box(1.56,.075,-.44,.036,.82,.019,trim);
 box(1.00,0,-.51,1.18,.075,.36,trim);
 box(1.23,1.13,-.57,.72,.21,.055,["#4d7892","#385f77","#2e536a"]);
 for(const z of [.75,2.0]){
   const x=3.92;
   box(x,0,z,.22,.23,.11,colors.wood);
   box(x,0,z+.58,.22,.23,.11,colors.wood);
   box(x,.22,z,.30,.065,.7,colors.wood);
   box(x+.26,.30,z,.06,.22,.7,colors.wood);
 }
 const offset=visual[0]===mx&&visual[1]===mz?.23:0;
 if(target().point)character(mx+offset,mz+.14,true);
 character(...visual);
 faces.sort((a,b)=>a.distance-b.distance).forEach(f=>poly(f.vertices.map(project),f.color));
 const sign=project([1.59,1.24,-.51]);
 ctx.font="700 "+Math.max(10,scale*.122)+"px system-ui";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillStyle="#fff9ef";ctx.fillText("ШКОЛА",sign[0],sign[1]);
 if(!target().point)return;
 marker=project([mx,1.04,mz]);
 const text=target().place;
 ctx.font="700 14px system-ui";const tw=ctx.measureText(text).width+28;
 ctx.fillStyle="#285d42";ctx.beginPath();ctx.roundRect(marker[0]-tw/2,marker[1]-14,tw,28,12);ctx.fill();
 ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillStyle="#fffdf0";ctx.fillText(text,marker[0],marker[1]+1);
}
function adjacent(){if(!target().point)return true;const [x,z]=target().point;return Math.abs(player[0]-x)+Math.abs(player[1]-z)<=1;}
function updateButton(){
 $("interact").disabled=moving||route.length>0;
 $("interact").textContent=!target().point?"Разобрать показания · E":adjacent()?(missions[index].witnesses?"Поговорить · E":"Открыть ситуацию · E"):"Подойти к "+(missions[index].witnesses?target().place:"метке");
}
function load(i){
 index=i;witnessCount=0;player=[0,3];visual=[...player];route=[];moving=false;facing=[0,-1];
 $("mission").textContent=(i+1)+". "+missions[i].title;
 $("objective").textContent=missions[i].goal;
 $("story").textContent=story(i)+" · "+mode(i);
 $("status").textContent=completed.has(i)?"Эпизод пройден":"";
 updateProgress();
 updateButton();render();
}
function step(dx,dz){
 const x=player[0]+dx,z=player[1]+dz;
 if(x<0||x>3||z<0||z>3)return;
 facing=[dx,dz];player=[x,z];moving=true;updateButton();
}
function approach(){
 if(moving||route.length)return;
 if(adjacent()){openScenario();return;}
 const [x,z]=target().point;
 let [a,b]=player;
 while(Math.abs(x-a)+Math.abs(z-b)>1){
  const dx=Math.sign(x-a),dz=dx?0:Math.sign(z-b);
  route.push([dx,dz]);a+=dx;b+=dz;
 }
 step(...route.shift());
}
function animate(time){
 const delta=Math.min(40,time-last||16);last=time;
 if(moving){
   const distance=Math.hypot(player[0]-visual[0],player[1]-visual[1]), amount=delta*.008;
   if(distance<=amount){
     visual=[...player];moving=false;
     if(route.length)step(...route.shift());
     else updateButton();
   }else visual=visual.map((v,i)=>v+(player[i]-v)*amount/distance);
   render();
 }
 requestAnimationFrame(animate);
}
function updateProgress(){
 $("progress").textContent=completed.size+" / "+missions.length+" уровней";
}
function drawMap(){
 const grid=$("mapGrid");grid.replaceChildren();
 for(const [title,top] of [["После звонка",22],["Школьное медиа",160],["Игровой чат",299],["Расследование во дворе",438]]){
  const label=document.createElement("strong");label.className="branch";label.textContent=title;label.style.top=top+"px";grid.append(label);
 }
 treeNodes.forEach(([x,y,parent],i)=>{
  if(parent<0)return;
  const [px,py]=treeNodes[parent], dx=x-px,dy=y-py;
  const line=document.createElement("div");line.className="map-line"+(completed.has(i)?" done":"");
  Object.assign(line.style,{left:px+"px",top:y-dy+"px",width:Math.hypot(dx,dy)+"px",transform:"rotate("+Math.atan2(dy,dx)+"rad)"});
  grid.append(line);
 });
 treeNodes.forEach(([x,y,parent],i)=>{
  const node=document.createElement("div");node.className="node";node.style.left=x+"px";node.style.top=y-29+"px";
  const button=document.createElement("button");button.disabled=!unlocked(i);
  const label=document.createElement("strong"), format=document.createElement("small");
  label.textContent=missions[i].title;format.textContent=mode(i);
  button.textContent=completed.has(i)?"✓":button.disabled?"🔒":missions[i].mode==="inspect"?"⌕":missions[i].mode==="order"?"≡":"◆";
  button.setAttribute("aria-label",missions[i].title+(button.disabled?". Сначала пройди «"+missions[parent].title+"»":""));
  if(i===index)button.setAttribute("aria-current","step");
  button.className=completed.has(i)?"passed":button.disabled?"":"available";
  button.onclick=()=>{$("map").close();load(i);};node.append(button,label,format);grid.append(node);
 });
}
function openMap(){drawMap();$("map").showModal();}
$("showMap").onclick=openMap;
$("scenarioMap").onclick=()=>{$("dialog").close();openMap();};
$("closeMap").onclick=()=>$("map").close();
function openWitness(dialog){
 const witness=target();
 $("scenarioTitle").textContent=witness.place;
 $("scenario").textContent=witness.note;
 $("choices").replaceChildren();$("feedback").textContent="";
 $("advance").textContent="Записать показание";$("advance").hidden=false;
 $("advance").onclick=()=>{
  witnessCount++;dialog.close();
  const next=target().place;
  $("objective").textContent=next?"Показания: "+witnessCount+"/3. Следующий свидетель: "+next+".":"Показания: 3/3. Открой разбор и отдели подтверждённые сведения от слухов.";
  updateButton();render();
 };
 dialog.showModal();
}
function sortEvidence(mission,finish){
 const area=$("choices"), assigned=Array(mission.cards.length).fill(null);
 const notes=document.createElement("details"), summary=document.createElement("summary");
 summary.textContent="Перечитать показания";notes.append(summary);
 for(const {place,note} of mission.witnesses){
  const item=document.createElement("p");item.textContent=place+": "+note;notes.append(item);
 }
 const pending=document.createElement("div"), columns=document.createElement("div");
 pending.className="evidence-list";columns.className="evidence-columns";
 const labels=["Что известно","Что пока только слух"];
 const bins=labels.map(label=>{
  const bin=document.createElement("section"), heading=document.createElement("h3"), list=document.createElement("div");
  heading.textContent=label;list.className="evidence-list";bin.append(heading,list);columns.append(bin);return list;
 });
 const check=document.createElement("button");check.className="primary";check.textContent="Проверить выводы";
 check.onclick=()=>{
  const mistakes=mission.cards.filter(([,known],i)=>assigned[i]!==Number(!known)).length;
  finish(mistakes===0,mistakes?"Проверь показания ещё раз. Утверждений не в своей колонке: "+mistakes+".":"Ответ Арсена касался окончания спора. По показаниям нельзя установить, кто управлял другим аккаунтом. Сообщи взрослому о самом призыве к насилию и покажи полный контекст без публичных обвинений.");
 };
 function drawCards(){
  pending.replaceChildren();bins.forEach(bin=>bin.replaceChildren());
  mission.cards.forEach(([claim],i)=>{
   const card=document.createElement("article"), text=document.createElement("p"), actions=document.createElement("div");
   text.textContent=claim;actions.className="evidence-actions";
   labels.forEach((label,column)=>{
    const button=document.createElement("button");button.textContent=label;
    button.setAttribute("aria-pressed",String(assigned[i]===column));
    button.onclick=()=>{assigned[i]=column;drawCards();cards[i][column].focus();};
    actions.append(button);
   });
   cards[i]=[...actions.children];
   card.append(text,actions);(assigned[i]===null?pending:bins[assigned[i]]).append(card);
  });
  check.disabled=assigned.includes(null);
 }
 const cards=[];
 area.replaceChildren(notes,pending,columns,check);
 drawCards();
}
function openScenario(){
 const dialog=$("dialog"), mission=missions[index];
 if(dialog.open||$("map").open||moving||!adjacent())return;
 if(mission.witnesses&&witnessCount<mission.witnesses.length){openWitness(dialog);return;}
 correct=false;$("scenarioTitle").textContent=mission.title;
 $("scenario").textContent=mission.witnesses?"Сверь показания и распредели утверждения между двумя колонками.":mission.scenario+(mission.question?" "+mission.question:"");
 $("feedback").textContent="";$("advance").hidden=true;
 const chosen=[];
 const next=treeNodes.findIndex(([,y,parent])=>parent===index&&y===treeNodes[index][1]);
 function finish(safe,feedback){
   if(correct)return;
   $("feedback").textContent=(safe?"Верный выбор. ":"Попробуй ещё раз. ")+feedback+(safe&&index===3?" Эльмира эже выслушала вас и передала сообщение администрации. Тимур вышел из группы и договорился поговорить со школьным психологом.":"");
   if(!safe)return;
   correct=true;completed.add(index);
   try{localStorage.setItem(storageKey,JSON.stringify([...completed]));}catch{}
   updateProgress();
   $("status").textContent=completed.size===missions.length?"Все уровни пройдены":"Эпизод пройден";
   $("choices").querySelectorAll("button").forEach(choice=>choice.disabled=true);
   $("advance").textContent=next<0?"К карте уровней":"Следующая миссия";
   $("advance").onclick=()=>{dialog.close();if(next<0)openMap();else load(next);};
   $("advance").hidden=false;$("advance").focus();
 }
 if(mission.witnesses){sortEvidence(mission,finish);dialog.showModal();return;}
 const buttons=mission.options.map(([label,feedback,safe],i)=>{
  const button=document.createElement("button");button.textContent=label;
  if(mission.mode)button.setAttribute("aria-pressed","false");
  button.onclick=()=>{
   if(!mission.mode){finish(safe,feedback);return;}
   const at=chosen.indexOf(i);
   if(at<0)chosen.push(i);else chosen.splice(at,1);
   buttons.forEach((item,n)=>{
    const order=chosen.indexOf(n);
    item.setAttribute("aria-pressed",String(order>=0));
    item.textContent=(mission.mode==="order"&&order>=0?(order+1)+". ":"")+mission.options[n][0];
   });
  };
  return button;
 });
 $("choices").replaceChildren(...buttons);
 if(mission.mode){
  const check=document.createElement("button");check.textContent="Проверить";check.className="primary";
  check.onclick=()=>{
   const safe=mission.mode==="inspect"?chosen.length===2&&chosen.every(i=>mission.options[i][2]):chosen.length===buttons.length&&chosen.every((i,n)=>mission.options[i][2]===n+1);
   finish(safe,safe?mission.result:mission.mode==="inspect"?"Отметь два способа проверить исходную публикацию.":"Проверь, в каком порядке Бек прекращает разговор, жалуется и блокирует контакт.");
  };
  $("choices").append(check);
 }
 dialog.showModal();
}
$("close").onclick=()=>$("dialog").close();
$("interact").onclick=approach;
document.querySelectorAll("[data-dir]").forEach(b=>b.onclick=()=>{if(!moving&&!route.length)step(...b.dataset.dir.split(",").map(Number));});
canvas.addEventListener("click",event=>{
 if(!target().point)return;
 const rect=canvas.getBoundingClientRect();
 if(Math.abs(event.clientX-rect.left-marker[0])<82&&Math.abs(event.clientY-rect.top-marker[1])<41)approach();
});
const keys={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],KeyW:[0,-1],KeyS:[0,1],KeyA:[-1,0],KeyD:[1,0]};
document.addEventListener("keydown",event=>{
 if($("dialog").open||$("map").open||event.altKey||event.ctrlKey||event.metaKey)return;
 if(keys[event.code]){event.preventDefault();if(!moving&&!route.length)step(...keys[event.code]);}
 if(event.code==="KeyE"&&!event.repeat)approach();
});
window.addEventListener("resize",render);
load(index);requestAnimationFrame(animate);
</script>
